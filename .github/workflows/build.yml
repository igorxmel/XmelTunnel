name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt pyinstaller pytest
      - name: Test
        run: python -m pytest -q tests
      - name: Build
        run: pyinstaller -y XmelTunnel.spec
      - name: Checksum
        shell: pwsh
        run: (Get-FileHash dist\XmelTunnel.exe -Algorithm SHA256).Hash.ToLower() + "  XmelTunnel.exe" | Out-File -Encoding ascii dist\XmelTunnel.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: XmelTunnel
          path: dist/XmelTunnel.exe*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/XmelTunnel.exe
            dist/XmelTunnel.exe.sha256
