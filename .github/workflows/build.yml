name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt pyinstaller pytest
      - name: Test
        run: python -m pytest -q tests
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-ChildItem 'C:\Program Files*\Inno Setup *\ISCC.exe' -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }
      - name: Build
        run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: XmelTunnel
          path: |
            dist/XmelTunnel.exe
            dist/XmelTunnel.exe.sha256
            dist/XmelTunnel-Setup.exe
            dist/XmelTunnel-Setup.exe.sha256
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/XmelTunnel-Setup.exe
            dist/XmelTunnel-Setup.exe.sha256
            dist/XmelTunnel.exe
            dist/XmelTunnel.exe.sha256
